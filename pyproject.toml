[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basemode"
version = "0.1.37"
description = "Make any LLM do raw text continuation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Fergus Fettes", email = "fergusfettes@gmail.com" }]
keywords = ["llm", "base-model", "completion", "continuation", "prompting", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.63.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/FergusFettes/basemode"
Documentation = "https://fergusfettes.github.io/basemode/"
Source = "https://github.com/FergusFettes/basemode"
Issues = "https://github.com/FergusFettes/basemode/issues"
Changelog = "https://github.com/FergusFettes/basemode/releases"

[project.scripts]
basemode = "basemode.cli:app"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocs-roamlinks-plugin>=0.3.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.11",
    "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basemode"]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["basemode"]

[tool.ruff.lint.per-file-ignores]
"src/basemode/strategies/fim.py" = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src/basemode --cov-report=term-missing -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: hits real APIs, not run by default"]

[tool.coverage.run]
source = ["src/basemode"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
