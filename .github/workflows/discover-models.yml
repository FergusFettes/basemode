name: Discover new provider models

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max candidates to probe per provider"
        required: false
        default: "6"
  workflow_run:
    workflows: ["Refresh verified models table"]
    types: [completed]

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Run after "Refresh verified models table" finishes (any Friday-3am
    # sequencing lives there), or on-demand via workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync deps
        run: uv sync --all-groups

      - name: Discover + probe new OpenAI/Anthropic models
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCOVER_MODELS_LIMIT: ${{ inputs.limit }}
        run: uv run python scripts/discover_new_models.py

      - name: Refresh verified model table
        run: uv run python scripts/generate_verified_models_table.py

      - name: Bump patch version if there's anything to publish
        run: |
          if git diff --quiet -- README.md data/ docs/; then
            echo "No content changes; leaving version as-is."
          else
            uv run python scripts/bump_patch_version.py
            printf '\n---\nIncludes a patch version bump — merging this triggers `publish.yml` to release it.\n' >> dist/model-discovery/summary.md
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(models): discover new OpenAI/Anthropic models"
          branch: "chore/discover-new-models"
          title: "chore(models): discover new OpenAI/Anthropic models"
          body-path: dist/model-discovery/summary.md
          labels: documentation
