name: Refresh verified models table

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync deps
        run: uv sync --all-groups

      - name: Regenerate verified model table
        run: uv run python scripts/generate_verified_models_table.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(models): refresh verified models table"
          branch: "chore/refresh-verified-models"
          title: "chore(models): refresh verified models table"
          body: |
            Automated refresh of:
            - README verified model table
            - data/verified_models_details.json
          labels: documentation
