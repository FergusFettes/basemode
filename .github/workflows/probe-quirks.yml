name: Probe model quirks

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Only probe models whose id contains this"
        required: false
  schedule:
    - cron: "15 4 * * 3"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync deps
        run: uv sync --locked --all-groups

      - name: Probe every verified model for known API-quirk classes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run python scripts/probe_model_quirks.py --model "${{ inputs.model }}"

      - name: Refresh verified model table
        run: uv run python scripts/generate_verified_models_table.py

      - name: Bump patch version if there's anything to publish
        run: |
          if [ -z "$(git status --porcelain -- README.md data/ docs/ src/basemode/data/)" ]; then
            echo "No content changes; leaving version as-is."
          else
            uv run python scripts/bump_patch_version.py
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(models): update known model quirks"
          branch: "chore/probe-model-quirks"
          title: "chore(models): update known model quirks"
          body-path: dist/quirk-probe/summary.md
          labels: documentation
